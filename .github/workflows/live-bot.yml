name: Live bot (moi gio)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "20 */2 * * *"

concurrency:
  group: live-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chay bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_ONLY_LEGS: ${{ vars.NOTIFY_ONLY_LEGS }}
        run: python live_bot.py

      - name: Luu trang thai vao repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_state.json || true
          if git diff --staged --quiet; then echo "Khong co thay doi"; exit 0; fi
          git commit -m "Cap nhat trang thai $(date -u +'%Y-%m-%d %H:%M') UTC [skip netlify]"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
